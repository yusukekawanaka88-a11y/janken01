<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <script src="js/jquery-2.1.3.min.js"></script>
  <link rel="stylesheet" href="css/sample.css">
  <title>じゃんけん</title>
</head>

<body>
  <header>
    <h1>じゃんけん</h1>
  </header>

  <main>
    <ul>
      <li id="gu_btn">グー</li>
      <li id="cho_btn">チョキ</li>
      <li id="par_btn">パー</li>
    </ul>
    <div>コンピュータの出した手は？「<span id="pc_hands">なに？</span>」</div>
    <div id="judgment">勝ち</div>
  </main>

  <footer>
    <div id="messege"></div>
  </footer>

  <script src="https://code.jquery.com/jquery-2.1.3.min.js"></script>
  <script>
    //じゃんけん用のSCRIPTを書いてください

    //ぐーver
    $("#gu_btn").on("click", function () {
      const r = Math.random();
      const n = Math.ceil(r * 3);
      console.log(n);

      if (n == 1) {
        $("#pc_hands").html("グー")
        $("#judgment").html("あいこ")
        $("#messege").html("あいこなのでもう一回！！！🤝")
      }

      if (n == 2) {
        $("#pc_hands").html("チョキ")
        $("#judgment").html("勝ち")
        $("#messege").html("やったね！！！㊗️")
      }

      if (n == 3) {
        $("#pc_hands").html("パー")
        $("#judgment").html("負け")
        $("#messege").html("ざんねん！！！😭")
      }
    }
    )
    //チョキver
    $("#cho_btn").on("click", function () {
      const r = Math.random();
      const n = Math.ceil(r * 3);
      console.log(n);

      if (n == 1) {
        $("#pc_hands").html("グー")
        $("#judgment").html("負け")
        $("#messege").html("ざんねん！！！😭")
      }

      if (n == 2) {
        $("#pc_hands").html("チョキ")
        $("#judgment").html("あいこ")
        $("#messege").html("あいこなのでもう一回！！！🤝")
      }

      if (n == 3) {
        $("#pc_hands").html("パー")
        $("#judgment").html("勝ち")
        $("#messege").html("やったね！！！㊗️")
      }
    }
    )

    //パーver
    $("#par_btn").on("click", function () {
      const r = Math.random();
      const n = Math.ceil(r * 3);
      console.log(n);

      if (n == 1) {
        $("#pc_hands").html("グー")
        $("#judgment").html("勝ち")
        $("#messege").html("やったね！！！㊗️")
      }

      if (n == 2) {
        $("#pc_hands").html("チョキ")
        $("#judgment").html("負け")
        $("#messege").html("ざんねん！！！😭")
      }

      if (n == 3) {
        $("#pc_hands").html("パー")
        $("#judgment").html("あいこ")
        $("#messege").html("あいこなのでもう一回！！！🤝")
      }
    }
    )

  </script>
</body>

</html>
